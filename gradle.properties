# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# 1.20.1 ForgeGradle decompiles Minecraft on first setup, which is memory-hungry.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true


## Environment Properties

# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
minecraft_version_range=[1.20.1,1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.10
forge_version_range=[47,)
# The loader version range can only use the major version of Forge/FML as bounds
loader_version_range=[47,)
# The mapping channel to use for mappings.
mapping_channel=official
mapping_version=1.20.1


## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=modtabs
# The human-readable display name for the mod.
mod_name=Mod Tabs
# The license of the mod.
mod_license=MIT License
# The mod version. See https://semver.org/
mod_version=1.20.1-2.4.1-Forge
# The group ID for the mod.
mod_group_id=vodmordia.modtabs
# The authors of the mod.
mod_authors=Originally developed by Sfiomn as Legendary Tabs, rewritten and enhanced by Vodmordia
# The description of the mod.
mod_description=Adds a tab menu on the inventory page to quickly navigate other mods screens.

# Dependency versions
# 1.9.x series ships its mixin config with no refmap, so dev-environment Mojmap classes can't
# be matched and OptionsScreen mixin fails on first resource reload. 1.4.2-forge (Dec 2023) is
# the last build from the pre-rewrite Architectury-based era, ships a refmap, and works in dev.
midnightlib_version=1.4.2-forge
