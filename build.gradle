plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// 1.20.1 targets Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Required by ForgeGradle 6 to copy resources to IDE output before launching.
    copyIdeResources = true

    // accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            // Mixin refmap remap for the dev environment.
            //
            // Production mods (Xaero's World Map, Selene/Moonlight, l2library, etc.) ship their
            // mixin refmap JSONs containing only SRG names like 'm_91383_'. The dev environment
            // uses Mojang official names ('runTick'), so without remapping, every mixin from those
            // mods fails with "Critical injection failure: ... could not find any targets".
            //
            // Pointing Mixin at the SRG→official mapping file ForgeGradle generates fixes all of
            // them at once.
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Mixin: ForgeGradle 6 runs the Mixin annotation processor and generates a refmap
// (Mojang → SRG) that's bundled into the jar so production builds can find their targets.
mixin {
    add sourceSets.main, 'modtabs.refmap.json'
    config 'modtabs.mixins.json'
}

repositories {
    maven {
        url = "https://www.cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "CurseForge"
        url = "https://minecraft.curseforge.com/api/maven/"
    }
    maven { url "https://api.modrinth.com/maven" }
    maven {
        url "https://maven.terraformersmc.com/releases/"
    }
    // Shadows_of_Fire's Maven (Apothic Attributes + Placebo).
    maven {
        name = "Shadows_of_Fire"
        url = "https://maven.shadowsoffire.dev/releases"
    }
    flatDir {
        dirs 'libs'
    }
}

// =============================================================================
//  Integration mod dependencies (Forge 1.20.1)
// =============================================================================
// All file IDs are pinned to the latest 1.20.1 Forge build at the time the
// 1.20.1 branch was cut. Bump as needed — each project's CurseForge "Files"
// page (filtered to 1.20.1 + Forge) is the source of truth.
//
// DROPPED on 1.20.1 (no Forge build exists):
//   - Reliable Backpacks (1484454) — NeoForge-era only
//   - Create: Brassworks Missions (1348982) — NeoForge 1.21.1 only
//   - Biology Dictionary (1426515) — no 1.20.1 build
//   - Sinytra Connector + Forgified Fabric API + RPG Crafting (Fabric)
// =============================================================================
dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Required at compile time — drives the in-game config UI.
    // fg.deobf() so ForgeGradle remaps SRG → official for both bytecode and the embedded mixin
    // refmap. Without that, MidnightLib's MixinOptionsScreen targets the production SRG name
    // 'm_7856_' which doesn't exist in the dev environment, and the dev client crashes during
    // the title-screen resource reload.
    implementation fg.deobf("maven.modrinth:midnightlib:${project.midnightlib_version}")

    // Core libs / equipment / books.
    implementation fg.deobf("curse.maven:curios-309927:6418456")
    implementation fg.deobf("curse.maven:patchouli-306770:7731017")
    implementation fg.deobf("curse.maven:architectury-api-419699:5137938")
    implementation fg.deobf("curse.maven:better-advancements-272515:5454907")
    implementation fg.deobf("curse.maven:eccentric-tome-597522:7285203")
    implementation fg.deobf("curse.maven:cloth-config-348521:5729105")

    // Skills / progression.
    implementation fg.deobf("curse.maven:puffish-skills-835091:7672794")
    implementation fg.deobf("curse.maven:reskillable-reimagined-1170464:7958820")
    // Project 1079687 was renamed from "memories-of-the-past" → "rpg-attribute-system" on CurseForge.
    implementation fg.deobf("curse.maven:rpg-attribute-system-1079687:8008921")
    implementation fg.deobf("curse.maven:jauml-1281310:7835241")
    // Curse Maven blocks direct download of the runic-skills artifact (403 Forbidden),
    // so we vendor the jar in libs/runicskills-1.0.0.jar and resolve it through the
    // flatDir repo above. The "blank" group is required by ForgeGradle's deobf cache key.
    // Disabled — its bundled l2tabs 0.3.3 conflicts with the L2 stack's TabRegistry API.
    // implementation fg.deobf("blank:runicskills:1.0.0")
    // Required by Runic Skills (yet_another_config_lib_v3 >= 3.4.2).
    // implementation fg.deobf("curse.maven:yacl-667299:6336646")

    // Backpacks.
    implementation fg.deobf("curse.maven:sophisticated-core-618298:8014107")
    implementation fg.deobf("curse.maven:sophisticated-backpacks-422301:8007547")
    implementation fg.deobf("curse.maven:travelers-backpack-321117:7816782")
    implementation fg.deobf("curse.maven:backpacked-352835:7866682")
    implementation fg.deobf("curse.maven:cosmetic-armor-reworked-237307:4600191")

    // FTB suite.
    implementation fg.deobf("curse.maven:ftb-quests-forge-289412:7909594")
    implementation fg.deobf("curse.maven:ftb-teams-forge-404468:7499810")
    implementation fg.deobf("curse.maven:ftb-chunks-forge-314906:7880858")
    implementation fg.deobf("curse.maven:ftb-library-forge-404465:7296748")
    implementation fg.deobf("curse.maven:framework-549225:7573740")

    // Advanced Team (clefal) — separate teams mod with its own HasTeam/NoTeam screens.
    // Curse Maven blocks direct download of this artifact (403 Forbidden), same as Runic Skills,
    // so we vendor the jar in libs/advanced-team-1.4.6.jar and resolve it through the flatDir
    // repo above. The "blank" group is required by ForgeGradle's deobf cache key.
    implementation fg.deobf("blank:advanced-team:1.4.6")
    // Nirvana Library — required by Advanced Team (com.clefal.nirvana_lib.* packages).
    implementation fg.deobf("curse.maven:nirvana-library-1164411:7986008")
    // Required transitive deps of Nirvana Library.
    implementation fg.deobf("curse.maven:common-network-806044:5486134")
    implementation fg.deobf("curse.maven:fzzy-config-1005914:7568893")

    // Map mods.
    implementation fg.deobf("curse.maven:journeymap-32274:5789363")
    implementation fg.deobf("curse.maven:xaeros-world-map-317780:7598469")
    implementation fg.deobf("curse.maven:map-atlases-forge-519759:7660146")

    // L2 stack (xkmc) + Modular Golems.
    implementation fg.deobf("curse.maven:l2library-620203:6806000")
    implementation fg.deobf("curse.maven:l2hostility-909207:7815389")
    implementation fg.deobf("curse.maven:l2-complements-758349:7606338")
    implementation fg.deobf("curse.maven:l2-artifacts-659547:6801939")
    implementation fg.deobf("curse.maven:modulargolems-690937:7948763")

    // Cobblemon (+ Kotlin for Forge runtime requirement).
    implementation fg.deobf("curse.maven:kotlin-for-forge-351264:7291067")
    implementation fg.deobf("curse.maven:cobblemon-687131:5375390")

    // Magic / spellcasting.
    implementation fg.deobf("curse.maven:geckolib-388172:7553267")
    implementation fg.deobf("curse.maven:ars-nouveau-401955:6688854")
    // Ars Elixirum on 1.20.1 lives at ars-elixirum-forge (project 620870), not the NeoForge slug.
    implementation fg.deobf("curse.maven:ars-elixirum-forge-620870:7985649")
    implementation fg.deobf("curse.maven:fragmentum-1123970:7983969")

    // Tech / automation.
    implementation fg.deobf("curse.maven:create-328085:7178761")
    implementation fg.deobf("curse.maven:brandons-core-231382:5422013")
    implementation fg.deobf("curse.maven:codechicken-lib-1-8-242818:5753868")
    implementation fg.deobf("curse.maven:draconic-evolution-223565:6793843")

    // Misc.
    implementation fg.deobf("curse.maven:selene-499980:7945711")
    implementation fg.deobf("curse.maven:archivist-1513409:7979569")

    // Villager Recruits — faction screen (U key by default).
    implementation fg.deobf("curse.maven:recruits-523860:7906232")

    // Apothic Attributes (+ Placebo, its hard runtime dep). Reflection-only integration on
    // our side; both jars need to be on the runtime classpath for AttributesGui to load.
    // Sourced from Shadows_of_Fire's official maven; bump versions in gradle.properties.
    implementation fg.deobf("dev.shadowsoffire:Placebo:${minecraft_version}-${project.placebo_version}")
    implementation fg.deobf("dev.shadowsoffire:ApothicAttributes:${minecraft_version}-${project.apothic_attributes_version}")
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'modtabs.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
